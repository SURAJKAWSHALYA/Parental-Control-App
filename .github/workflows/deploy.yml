name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Backend Tests
      run: npm test
      env:
        MONGODB_URI: mongodb://127.0.0.1:27017/parental_control_test
        JWT_SECRET: test_secret
        
    - name: Build Backend
      run: npm run build

  frontend-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./parent-dashboard

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './parent-dashboard/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Frontend Tests
      run: npm test
      
    - name: Build Frontend
      run: npm run build
